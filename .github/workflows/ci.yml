name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
  sdl2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DVR_HOST_SDL2=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          if ! command -v cmake >/dev/null || ! command -v make >/dev/null; then
            if command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y cmake make
            else
              apk add --no-cache cmake make
            fi
          fi
          cmake --version
      - name: List SDK libraries
        run: ls "$VITASDK/arm-vita-eabi/lib" | sort | tr '\n' ' '
      - name: Configure
        run: cmake -S . -B build-vita -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DVR_BUILD_SAMPLES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-vita
      - name: Check library
        run: test -f build-vita/libvita_runtime.a
